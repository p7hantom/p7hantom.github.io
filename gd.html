<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash JS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-wrapper {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.3);
            border: 2px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #000;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .progress-bar-container {
            width: 80%;
            height: 12px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #fff;
            border-radius: 6px;
            margin: 0 auto;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #00e676;
            transition: width 0.1s linear;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            pointer-events: auto;
        }
        .overlay h1 {
            font-size: 3rem;
            color: #00e676;
            text-shadow: 0 0 10px #00e676;
        }
        .btn {
            background: #00e676;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            background: #00b359;
        }
        .instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        
        <div class="ui-layer">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <!-- Start Overlay -->
        <div class="overlay" id="startScreen">
            <h1>GEOMETRY DASH</h1>
            <button class="btn" onclick="startGame()">PLAY</button>
            <div class="instructions">Press [SPACE], [UP], or Click to Jump</div>
        </div>

        <!-- Game Over Overlay -->
        <div class="overlay" id="gameOverScreen" style="display: none;">
            <h1 style="color: #ff5252; text-shadow: 0 0 10px #ff5252;">CRASHED!</h1>
            <p id="deathAttempt">Attempts: 1</p>
            <button class="btn" onclick="restartGame()">TRY AGAIN</button>
        </div>

        <!-- Victory Overlay -->
        <div class="overlay" id="victoryScreen" style="display: none;">
            <h1>LEVEL COMPLETE!</h1>
            <button class="btn" onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const progressBar = document.getElementById('progressBar');

        // Game Constants
        const GRAVITY = 0.8;
        const JUMP_FORCE = -12;
        const SPEED = 6.5;
        const GROUND_Y = 370;

        // Audio Synth Generator (No external audio files needed!)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playJumpSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playExplodeSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        // Game Variables
        let isRunning = false;
        let cameraX = 0;
        let attempts = 1;
        let particles = [];
        let keys = {};

        // Cube Object
        const player = {
            x: 100,
            y: GROUND_Y - 40,
            width: 35,
            height: 35,
            vy: 0,
            rotation: 0,
            isGrounded: false,
            reset: function() {
                this.x = 100;
                this.y = GROUND_Y - 35;
                this.vy = 0;
                this.rotation = 0;
                this.isGrounded = true;
            }
        };

        // Level Map (0: air, 1: block, 2: spike, 3: yellow pad, 4: end flag)
        // Grid size: 40x40px per tile
        const levelWidth = 12000;
        const map = [
            // Blocks & Spikes (x position in pixels, type)
            { x: 600, y: GROUND_Y - 40, type: 2 },
            { x: 900, y: GROUND_Y - 40, type: 2 },
            { x: 940, y: GROUND_Y - 40, type: 2 },
            
            { x: 1300, y: GROUND_Y - 40, type: 1 },
            { x: 1340, y: GROUND_Y - 80, type: 1 },
            { x: 1380, y: GROUND_Y - 40, type: 2 },

            { x: 1700, y: GROUND_Y - 10, type: 3 }, // Jump Pad
            { x: 1950, y: GROUND_Y - 120, type: 1 },
            { x: 1990, y: GROUND_Y - 120, type: 1 },
            { x: 2030, y: GROUND_Y - 120, type: 2 },

            { x: 2400, y: GROUND_Y - 40, type: 2 },
            { x: 2440, y: GROUND_Y - 40, type: 2 },
            { x: 2480, y: GROUND_Y - 40, type: 2 },

            { x: 2900, y: GROUND_Y - 40, type: 1 },
            { x: 2940, y: GROUND_Y - 40, type: 1 },
            { x: 2980, y: GROUND_Y - 40, type: 1 },
            { x: 3020, y: GROUND_Y - 80, type: 2 },

            { x: 3400, y: GROUND_Y - 10, type: 3 },
            { x: 3750, y: GROUND_Y - 160, type: 1 },
            { x: 3790, y: GROUND_Y - 160, type: 1 },

            { x: 4200, y: GROUND_Y - 40, type: 2 },
            { x: 4240, y: GROUND_Y - 40, type: 2 },

            { x: 4700, y: GROUND_Y - 40, type: 4 } // Finish Portal
        ];

        // Controls
        window.addEventListener('keydown', e => { if(e.code === 'Space' || e.code === 'ArrowUp') keys.jump = true; });
        window.addEventListener('keyup', e => { if(e.code === 'Space' || e.code === 'ArrowUp') keys.jump = false; });
        canvas.addEventListener('mousedown', () => keys.jump = true);
        canvas.addEventListener('mouseup', () => keys.jump = false);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); keys.jump = true; });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); keys.jump = false; });

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            isRunning = true;
            resetGame();
            requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('victoryScreen').style.display = 'none';
            attempts++;
            resetGame();
            isRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            player.reset();
            cameraX = 0;
            particles = [];
        }

        function triggerDeath() {
            isRunning = false;
            playExplodeSound();
            createExplosion(player.x + player.width/2, player.y + player.height/2);
            document.getElementById('deathAttempt').innerText = `Attempts: ${attempts}`;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        function triggerWin() {
            isRunning = false;
            document.getElementById('victoryScreen').style.display = 'flex';
        }

        function createExplosion(x, y) {
            for(let i=0; i<30; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    size: Math.random() * 6 + 2,
                    life: 1
                });
            }
        }

        // Main Game Engine Loop
        function gameLoop() {
            if (!isRunning) {
                // Render death particles animation even if stopped
                if (particles.length > 0) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    drawBackground();
                    drawParticles();
                    requestAnimationFrame(gameLoop);
                }
                return;
            }

            // --- UPDATE PHYSICS ---
            player.x += SPEED;
            cameraX = player.x - 100;

            // Apply Gravity
            player.vy += GRAVITY;
            player.y += player.vy;

            // Handle Ground Collision
            player.isGrounded = false;
            if (player.y + player.height >= GROUND_Y) {
                player.y = GROUND_Y - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }

            // Object Collisions
            map.forEach(obj => {
                // AABB Hitbox logic
                let px = player.x, py = player.y, pw = player.width, ph = player.height;
                let ox = obj.x, oy = obj.y, ow = 40, oh = 40;

                if (px < ox + ow && px + pw > ox && py < oy + oh && py + ph > oy) {
                    // Spikes
                    if (obj.type === 2) {
                        // Tight hitbox for spikes
                        if (px + pw - 8 > ox && px + 8 < ox + ow && py + ph > oy + 12) {
                            triggerDeath();
                        }
                    } 
                    // Solid Block
                    else if (obj.type === 1) {
                        // Landing on top of block
                        if (player.vy > 0 && py + ph - player.vy <= oy + 10) {
                            player.y = oy - ph;
                            player.vy = 0;
                            player.isGrounded = true;
                        } else { // Hit side of block
                            triggerDeath();
                        }
                    }
                    // Jump Pad
                    else if (obj.type === 3) {
                        player.vy = JUMP_FORCE * 1.35;
                        playJumpSound();
                    }
                    // Finish Portal
                    else if (obj.type === 4) {
                        triggerWin();
                    }
                }
            });

            // Handle Jumping
            if (keys.jump && player.isGrounded) {
                player.vy = JUMP_FORCE;
                player.isGrounded = false;
                playJumpSound();
            }

            // Rotate player when jumping
            if (!player.isGrounded) {
                player.rotation += 8;
            } else {
                player.rotation = Math.round(player.rotation / 90) * 90;
            }

            // Fall Off Screen Check
            if (player.y > canvas.height) {
                triggerDeath();
            }

            // Update Progress Bar UI
            let progress = Math.min(100, Math.max(0, (player.x / 4700) * 100));
            progressBar.style.width = progress + '%';

            // --- DRAW FRAME ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            drawMap();
            drawPlayer();
            drawParticles();

            requestAnimationFrame(gameLoop);
        }

        // --- GRAPHICS & RENDERING ---
        function drawBackground() {
            // Neon Gradient Background
            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#0f0c20');
            bgGrad.addColorStop(1, '#06202e');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ground Floor
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

            // Ground Line Highlight
            ctx.strokeStyle = '#00e676';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(canvas.width, GROUND_Y);
            ctx.stroke();
        }

        function drawMap() {
            map.forEach(obj => {
                let screenX = obj.x - cameraX;
                // Only render objects visible on screen
                if (screenX > -50 && screenX < canvas.width + 50) {
                    
                    // 1: Solid Block
                    if (obj.type === 1) {
                        ctx.fillStyle = '#161b22';
                        ctx.fillRect(screenX, obj.y, 40, 40);
                        ctx.strokeStyle = '#00e676';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(screenX, obj.y, 40, 40);
                    } 
                    // 2: Spike
                    else if (obj.type === 2) {
                        ctx.fillStyle = '#ff5252';
                        ctx.beginPath();
                        ctx.moveTo(screenX, obj.y + 40);
                        ctx.lineTo(screenX + 20, obj.y);
                        ctx.lineTo(screenX + 40, obj.y + 40);
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    } 
                    // 3: Jump Pad
                    else if (obj.type === 3) {
                        ctx.fillStyle = '#ffea00';
                        ctx.fillRect(screenX, obj.y + 30, 40, 10);
                    }
                    // 4: Finish Portal
                    else if (obj.type === 4) {
                        ctx.fillStyle = '#00e676';
                        ctx.fillRect(screenX + 15, obj.y - 40, 10, 80);
                    }
                }
            });
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x - cameraX + player.width / 2, player.y + player.height / 2);
            ctx.rotate((player.rotation * Math.PI) / 180);

            // Cube Body
            ctx.fillStyle = '#ffea00';
            ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);

            // Cube Inner Outline / Face
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.strokeRect(-player.width / 2, -player.height / 2, player.width, player.height);

            ctx.fillStyle = '#000000';
            ctx.fillRect(-8, -8, 6, 6);
            ctx.fillRect(2, -8, 6, 6);
            ctx.fillRect(-6, 4, 14, 4);

            ctx.restore();
        }

        function drawParticles() {
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                
                ctx.fillStyle = `rgba(255, 234, 0, ${Math.max(0, p.life)})`;
                ctx.fillRect(p.x - cameraX, p.y, p.size, p.size);

                if (p.life <= 0) particles.splice(index, 1);
            });
        }
    </script>
</body>
</html>
